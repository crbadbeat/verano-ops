  <text x="60" y="31" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" letter-spacing="1.5" fill="#0d9488">VERANO</text>
  <text x="61" y="46" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="4.2" fill="#f59e0b">OUTDOOR LIVING</text>
